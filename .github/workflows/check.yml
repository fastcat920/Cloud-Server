name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find _core tests -name '*.php' ! -name view.php -print0 | xargs -0 -n1 php -l && php -l index.php
      - name: Check JavaScript syntax
        run: node --check assets/app.js && node --check assets/ui.js && node --check assets/config-form.js && node --check assets/gtm.js
      - name: Recursive configuration form tests
        run: node tests/config-form.mjs && node tests/config-edit.mjs && node tests/gtm-form.mjs
      - name: Native unit tests
        run: php tests/unit.php && php tests/default-template.php && php tests/reliability.php && php tests/gtm.php && php tests/gtm-isolation.php
      - name: Isolated HTTP integration tests
        run: PHP_BINARY=php python3 tests/integration.py
      - name: HTTPS connection reuse tests
        run: PHP_BINARY=php python3 tests/http-reuse.py
      - name: Same-directory deployment and update tests
        run: python3 tests/deployment.py
